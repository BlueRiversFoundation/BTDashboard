<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barrier Tracker · Traducciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f3f7f5;
  --panel: #ffffff;
  --ink: #14302a;
  --muted: #566d65;
  --line: #d3dfd9;
  --green: #2c7a58;
  --green-ink: #ffffff;
  --green-soft: #dcefe5;
  --water: #245f86;
  --water-soft: #dbeaf3;
  --amber: #8f5600;
  --amber-soft: #fbecc8;
  --danger: #a8231b;
  --danger-soft: #f8dcd9;
  --radius: 6px;
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.5 var(--sans);
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--water); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- barra superior ---------- */
.top { background: var(--ink); color: #fff; }
.top-in { max-width: 1120px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .1px; margin-right: auto; }
.brand small { font-weight: 400; opacity: .75; font-size: 14px; }
.brand svg { flex: none; }
.who { display: flex; align-items: center; gap: 10px; font-size: 14px; flex-wrap: wrap; }
.who .role { background: rgba(255,255,255,.14); padding: 2px 8px; border-radius: 99px; font-size: 13px; }
.top button { background: transparent; border: 1px solid rgba(255,255,255,.4); color: #fff; padding: 5px 12px; border-radius: var(--radius); cursor: pointer; }
.top button:hover { background: rgba(255,255,255,.12); }

/* ---------- contenedor ---------- */
.wrap { max-width: 1120px; margin: 0 auto; padding: 24px 20px 64px; }
h1 { font-size: 26px; line-height: 1.2; margin: 0 0 6px; }
h2 { font-size: 18px; margin: 0 0 12px; }
.lead { color: var(--muted); margin: 0 0 24px; max-width: 60ch; }

/* ---------- botones y campos ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 600; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--green); border-color: var(--green); color: var(--green-ink); }
.btn.primary:hover { background: #246849; }
.btn.danger { color: var(--danger); border-color: var(--danger-soft); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn.sm { padding: 6px 12px; font-size: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
.field label { font-weight: 600; font-size: 14px; }
.input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
.input:focus { border-color: var(--water); }
.msg { padding: 10px 12px; border-radius: var(--radius); margin: 0 0 16px; font-size: 15px; }
.msg.err { background: var(--danger-soft); color: var(--danger); }
.msg.info { background: var(--water-soft); color: var(--water); }
.msg.warn { background: var(--amber-soft); color: var(--amber); }

/* ---------- acceso ---------- */
.login { max-width: 400px; margin: 8vh auto 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 28px; }
.login h1 { font-size: 22px; }

/* ---------- lista de idiomas ---------- */
.langs { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.lang-row { display: grid; grid-template-columns: minmax(160px, 1.2fr) 130px minmax(160px, 1fr) auto; gap: 16px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); }
.lang-row:first-child { border-top: 0; }
.lang-name { font-weight: 600; }
.lang-name span { color: var(--muted); font-weight: 400; margin-left: 6px; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; }
.pill.draft { background: var(--water-soft); color: var(--water); }
.pill.in_review { background: var(--amber-soft); color: var(--amber); }
.pill.published { background: var(--green-soft); color: var(--green); }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--green); transition: width .25s ease; }
.bar-label { font-size: 13px; color: var(--muted); margin-top: 4px; }
.empty { padding: 28px 18px; color: var(--muted); }
.newlang { margin-top: 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.newlang form { display: grid; grid-template-columns: 180px minmax(180px, 1fr) auto; gap: 12px; align-items: end; }
.newlang .field { margin: 0; }

/* ---------- editor ---------- */
.ed-head { background: var(--paper); border-bottom: 1px solid var(--line); padding: 14px 0 12px; }
@media (min-width: 761px) { .ed-head { position: sticky; top: 0; z-index: 5; } }
.ed-head-in { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
.ed-line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ed-line + .ed-line { margin-top: 10px; }
.back { background: none; border: 0; padding: 0; color: var(--water); cursor: pointer; font-weight: 600; }
.back:hover { text-decoration: underline; }
.ed-title { font-size: 22px; font-weight: 700; margin: 0; }
.ed-title span { color: var(--muted); font-weight: 400; font-size: 16px; margin-left: 6px; }
.grow { margin-right: auto; }
.savestate { font-size: 14px; color: var(--muted); text-align: right; margin-left: auto; }
.savestate.err { color: var(--danger); }
.gauge { display: flex; gap: 1px; height: 20px; align-items: stretch; margin-top: 10px; overflow: hidden; }
.gauge .t { flex: 1 1 0; min-width: 0; background: var(--line); border-radius: 1px; cursor: pointer; }
.gauge .t.done { background: var(--green); }
.gauge .t.warn { background: #d99a1e; }
.gauge .t:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
.gauge-info { font-size: 14px; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 3px 12px; font-size: 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.search { max-width: 220px; padding: 5px 10px; }
.cols { max-width: 1120px; margin: 0 auto; padding: 14px 20px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; color: var(--muted); font-size: 14px; font-weight: 600; }
.list { max-width: 1120px; margin: 0 auto; padding: 4px 20px 80px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; padding: 14px 0; border-top: 1px solid var(--line); scroll-margin-top: 180px; }
.row:first-child { border-top: 0; }
.row .id { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.row .en { margin: 0; font: 400 17px/1.5 var(--serif); white-space: pre-wrap; overflow-wrap: anywhere; }
.row textarea { display: block; width: 100%; min-height: 44px; resize: none; overflow: hidden; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; line-height: 1.45; }
.row textarea:focus { border-color: var(--water); }
.row textarea[readonly] { background: #eef3f1; color: #3b504a; }
.row .flag { display: block; margin-top: 4px; font-size: 13px; color: var(--amber); }
.row.flash { animation: flash 1.2s ease-out 1; }
@keyframes flash { from { background: var(--water-soft); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .row.flash { animation: none; } .bar > i { transition: none; } }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.import { margin-top: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.import .lead { margin-bottom: 14px; }
.import .grid { display: grid; grid-template-columns: minmax(200px, 1.4fr) 140px minmax(160px, 1fr) auto; gap: 12px; align-items: end; }
.import .field { margin: 0; }
.report { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
.report ul { margin: 0 0 12px; padding-left: 18px; }
.report li { margin: 5px 0; }
.report details { margin-top: 2px; }
.report summary { cursor: pointer; color: var(--water); font-size: 14px; }
.report .ids { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; margin: 4px 0 0; }
.report .rv { font-size: 13px; margin: 6px 0; overflow-wrap: anywhere; }
.report .rv b { font-weight: 600; }
@media (max-width: 760px) { .import .grid { grid-template-columns: 1fr; } }
.gauge .t.ai { background: #5f9fc9; }
.gauge .t.sent { background: #1f8a53; }
.row .flag.ai { color: var(--water); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row .flag.ai button { border: 1px solid var(--water); background: transparent; color: var(--water); border-radius: 99px; padding: 1px 10px; font-size: 13px; cursor: pointer; }
.row .flag.ai button:hover { background: var(--water-soft); }
.row.isai textarea { border-color: #9cc4de; background: #f4f9fc; }
.row.ischecked textarea { border-color: #9cc9ac; }
.chk { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; font-size: 14px; }
.selectbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row .pick { float: left; margin: 3px 10px 0 0; }
.lang-name .aitag { display: block; font-size: 12px; font-weight: 400; color: var(--water); margin-top: 2px; }
.lang-row .del { color: var(--danger); border-color: var(--danger-soft); }
.lang-group { padding: 10px 18px; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; border-top: 1px solid var(--line); }
.lang-group:first-child { border-top: 0; }
.lang-group.published { background: var(--green-soft); color: var(--green); }
.lang-group.in_review { background: var(--amber-soft); color: var(--amber); }
.lang-group.draft { background: var(--water-soft); color: var(--water); }
.pager { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.pager select { padding: 5px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; max-width: 100%; }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--ink); color: #fff; padding: 10px 16px; border-radius: var(--radius); font-size: 15px; box-shadow: 0 4px 16px rgba(0,0,0,.25); max-width: 92vw; }
.toast.err { background: var(--danger); }

@media (max-width: 760px) {
  .wrap { padding: 18px 14px 56px; }
  .lang-row { grid-template-columns: 1fr auto; row-gap: 8px; }
  .lang-row .progress { grid-column: 1 / -1; order: 3; }
  .newlang form { grid-template-columns: 1fr; }
  .cols { display: none; }
  .row { grid-template-columns: 1fr; gap: 8px; scroll-margin-top: 12px; }
  .ed-head-in, .list { padding-left: 14px; padding-right: 14px; }
  .search { max-width: none; flex: 1 1 100%; }
  .savestate { text-align: left; }
  .gauge { gap: 0; }
  .top-in { gap: 8px 12px; }
  .top-in .brand { order: 1; }
  .top-in > button { order: 2; }
  .top-in .who { order: 3; width: 100%; }
  .pager, .selectbar { width: 100%; }
  .pager span { white-space: normal; }
}
</style>
</head>

/* ------------------------- utilidades ------------------------- */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'data') Object.assign(el.dataset, v);
    else if (k === 'text') el.textContent = v;
    else if (k in el && k !== 'list') { try { el[k] = v; } catch (e) { el.setAttribute(k, v); } }
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

  const el = h('div', { class: 'toast' + (isErr ? ' err' : '') }, msg);

/* ------------------------- importar CSV ------------------------- */
function parseCsv(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const first = text.split(/\r?\n/, 1)[0];
  const delim = [';', ',', '\t'].map((d) => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c;
    } else if (c === '"' && cell === '') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; rows.push(row); row = []; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim() !== ''));
}
const normText = (x) => x.normalize('NFKD').toLowerCase().replace(/[^a-z0-9]+/g, '');
function dice(a, b) {
  if (a === b) return 1; if (a.length < 2 || b.length < 2) return 0;
  const grams = (s) => { const m = new Map(); for (let i = 0; i < s.length - 1; i++) { const g = s.slice(i, i + 2); m.set(g, (m.get(g) || 0) + 1); } return m; };
  const A = grams(a), B = grams(b); let hit = 0;
  for (const [g, n] of A) hit += Math.min(n, B.get(g) || 0);
  return (2 * hit) / (a.length + b.length - 2);
}
const short = (x, n) => { x = String(x).replace(/\s+/g, ' '); return x.length > n ? x.slice(0, n) + '…' : x; };

/* Coloca cada fila del CSV en su frase del portal. Se fía del id si el inglés del archivo coincide con el del
   portal; si no, busca el mismo inglés en otro id (así se corrigen ids repetidos o desplazados). */
function analyzeImport(rows, trCol, hasEn, src) {
  const byId = new Map(src.map((s) => [s.id_text, { en: s.text, n: normText(s.text) }]));
  const byNorm = new Map();
  for (const [id, v] of byId) { if (!byNorm.has(v.n)) byNorm.set(v.n, []); byNorm.get(v.n).push(id); }
  const A = { map: new Map(), remap: [], empty: [], unknown: [], review: [], dupSame: 0, dupDiff: [] };
  for (const r of rows.slice(1)) {
    const id = (r[0] || '').trim();
    if (!/^\d+$/.test(id)) { A.unknown.push(id || '(vacío)'); continue; }
    const tr = (r[trCol] || '').replace(/\r\n?/g, '\n').trim();
    if (!tr) { A.empty.push(id); continue; }
    const en = hasEn ? (r[1] || '') : null; const s = byId.get(id);
    let target = null, how = '';
    if (en === null) { if (s) { target = id; how = 'ok'; } else A.unknown.push(id); }
    else {
      const n = normText(en);
      if (s && (n === s.n || dice(n, s.n) >= 0.9)) { target = id; how = 'ok'; }
      else {
        const cand = byNorm.get(n);
        if (cand && cand.length === 1) { target = cand[0]; how = 'remap'; }
        else {
          // sin coincidencia exacta: busca el texto MÁS parecido, pero solo si gana con claridad
          let best = null, bestScore = 0, second = 0;
          for (const [oid, v] of byId) { const d = dice(n, v.n); if (d > bestScore) { second = bestScore; bestScore = d; best = oid; } else if (d > second) second = d; }
          if (best && bestScore >= 0.93 && bestScore - second >= 0.03) { target = best; how = 'remap'; }
          else if (s) A.review.push({ id, en, srcEn: s.en });
          else A.unknown.push(id);
        }
      }
    }
    if (!target) continue;
    if (A.map.has(target)) { if (A.map.get(target).text === tr) A.dupSame++; else A.dupDiff.push(target); continue; }
    A.map.set(target, { text: tr, from: id });
    if (how === 'remap' && target !== id) A.remap.push(id + '→' + target);
  }
  A.missing = src.filter((s) => s.active && !A.map.has(s.id_text)).map((s) => s.id_text);
  return A;
}

async function reviewImport(f, codeInput, nameInput, out, say, aiChk) {
  let text;
  try { text = new TextDecoder('utf-8', { fatal: true }).decode(await f.arrayBuffer()); } catch (e) { return say(t('importNotUtf8')); }
  const rows = parseCsv(text);
  const header = (rows[0] || []).map((x) => x.trim().toLowerCase());
  if (rows.length < 2 || header.length < 2 || header[0] !== 'id') return say(t('importBadFormat'));
  const hasEn = header.length >= 3 && header[1] === 'en'; const trCol = header.length >= 3 ? 2 : 1;
  let code = codeInput.value.trim().toLowerCase();
  if (!code && /^[a-z]{2,3}$/.test(header[trCol])) { code = header[trCol]; codeInput.value = code; }
  if (!/^[a-z]{2,3}$/.test(code)) return say(t('importNeedCode'));

  const sb = S.sb;
  const lg = await sb.from('portal_languages').select('lang,name,status').eq('app_code', APP).eq('lang', code).maybeSingle();
  if (lg.error) return say(t('genericError', { msg: errMsg(lg.error) }));
  const isNew = !lg.data;
  if (lg.data && lg.data.status !== 'draft') return say(t('importNotDraft', { status: t('status.' + lg.data.status) }));
  if (isNew && !nameInput.value.trim()) return say(t('importNeedName'));
  const langName = isNew ? nameInput.value.trim() : lg.data.name;

  const [src, ex] = await Promise.all([
    sb.from('translation_source').select('id_text,text,active').eq('app_code', APP),
    isNew ? Promise.resolve({ data: [] }) : sb.from('translation_drafts').select('id_text,text').eq('app_code', APP).eq('lang', code)
  ]);
  if (src.error || ex.error) return say(t('genericError', { msg: errMsg(src.error || ex.error) }));
  const A = analyzeImport(rows, trCol, hasEn, src.data);
  const before = new Map((ex.data || []).map((d) => [d.id_text, d.text]));
  let overwrite = 0; for (const [id, v] of A.map) { const old = (before.get(id) || '').trim(); if (old && old !== v.text) overwrite++; }

  const li = (key, n, ids, ok) => (n ? h('li', {}, t(key, { n }), ids && ids.length ? h('details', {}, h('summary', {}, ids.length > 12 ? ids.slice(0, 12).join(', ') + '…' : ids.join(', ')), h('p', { class: 'ids' }, ids.join(', '))) : null) : null);
  const list = h('ul', {},
    h('li', {}, h('strong', {}, t('repReady', { n: A.map.size }))),
    li('repRemap', A.remap.length, A.remap),
    li('repEmpty', A.empty.length, A.empty),
    li('repUnknown', A.unknown.length, A.unknown),
    li('repReview', A.review.length, A.review.map((r) => r.id)),
    (A.dupSame || A.dupDiff.length) ? h('li', {}, t('repDup', { same: A.dupSame, diff: A.dupDiff.length }), A.dupDiff.length ? h('details', {}, h('summary', {}, A.dupDiff.join(', '))) : null) : null,
    li('repMissing', A.missing.length, A.missing),
    li('repOverwrite', overwrite));
  const review = A.review.length ? h('details', { open: true }, h('summary', {}, t('repReview', { n: A.review.length })),
    A.review.slice(0, 30).map((r) => h('p', { class: 'rv' }, h('b', {}, '#' + r.id + ' '), t('repFile') + ': «' + short(r.en, 90) + '» — ' + t('repPortal') + ': «' + short(r.srcEn, 90) + '»'))) : null;
  const go = h('button', { class: 'btn primary', type: 'button', disabled: A.map.size === 0, onclick: () => doImport(code, langName, isNew, A, overwrite, go, !!(aiChk && aiChk.checked)) }, t('importLoad', { n: A.map.size }));
  const cancel = h('button', { class: 'btn', type: 'button', onclick: () => out.replaceChildren() }, t('importCancel'));
  out.replaceChildren(h('div', { class: 'report' }, list, review, h('div', { class: 'actions' }, go, cancel)));
}

async function doImport(code, name, isNew, A, overwrite, btn, aiFlag) {
  if (!confirm(t('importConfirm', { n: A.map.size, name, code, o: overwrite }))) return;
  btn.disabled = true;
  const sb = S.sb;
  if (isNew) {
    const r = await sb.from('portal_languages').insert({ app_code: APP, lang: code, name });
    if (r.error) { btn.disabled = false; return toast(t('genericError', { msg: errMsg(r.error) }), true); }
  }
  const all = [...A.map].map(([id_text, v]) => { const o = { app_code: APP, lang: code, id_text, text: v.text }; if (!S.noAi) o.ai = aiFlag; return o; });
  for (let i = 0; i < all.length; i += 100) {
    const r = await sb.from('translation_drafts').upsert(all.slice(i, i + 100), { onConflict: 'app_code,lang,id_text' });
    if (r.error) { btn.disabled = false; return toast(t('genericError', { msg: errMsg(r.error) }), true); }
  }
  toast(t('importDone', { n: all.length }));
  openEditor(code);
}

/* ---------------------------- editor ---------------------------- */
async function openEditor(lang) {
  S.view = 'editor';
  shell(h('main', { class: 'wrap' }, h('p', { class: 'lead' }, t('loading'))));
  const sb = S.sb;
  const draftsQ = (cols) => sb.from('translation_drafts').select(cols).eq('app_code', APP).eq('lang', lang);
  let [src, dr, lg, live] = await Promise.all([
    sb.from('translation_source').select('id_text,text').eq('app_code', APP).eq('active', true),
    draftsQ('id_text,text,ai,checked'),
    sb.from('portal_languages').select('lang,name,status,review_note').eq('app_code', APP).eq('lang', lang).single(),
    sb.from('translations').select('id_text,text').eq('app_code', APP).eq('langue', lang)
  ]);
  // Si todavía no se han ejecutado portal_3_ia.sql / portal_5_enviar_bloques.sql, esas columnas no
  // existen: se trabaja sin IA y/o sin marca de "enviado a revisar".
  S.noAi = false; S.noChecked = false;
  if (dr.error && /checked/.test(errMsg(dr.error))) { S.noChecked = true; dr = await draftsQ('id_text,text,ai'); }
  if (dr.error && /\bai\b/.test(errMsg(dr.error))) { S.noAi = true; dr = await draftsQ('id_text,text'); }
  const failed = src.error || dr.error || lg.error;
  if (failed) { toast(t('genericError', { msg: errMsg(failed) }), true); return renderHome(); }
  const saved = new Map(dr.data.map((r) => [r.id_text, r]));
  const liveMap = new Map((live.data || []).map((r) => [r.id_text, r.text]));
  const isPublished = lg.data.status === 'published';
  const items = src.data
    .map((r) => { const d = saved.get(r.id_text); const text = d ? d.text : '';
      const pending = isPublished && text.trim() !== '' && liveMap.has(r.id_text) && liveMap.get(r.id_text) !== text;
      return { id: r.id_text, en: r.text, text, ai: !!(d && d.ai && text.trim() !== ''), checked: !!(d && d.checked && text.trim() !== ''), pending }; })
    .sort((a, b) => Number(a.id) - Number(b.id));
  items.forEach((it) => { it.warn = hasWarn(it.en, it.text); });
  S.ed = {
    lang, name: lg.data.name, status: lg.data.status, note: lg.data.review_note,
    items, byId: new Map(items.map((it) => [it.id, it])),
    filter: 'all', q: '', timers: new Map(), dirty: new Set(), inflight: 0, lastError: '', page: 0, pageSize: 25,
    els: {}
  };
  renderEditor();
}

function edCounts() {
  const ed = S.ed;
  const empty = ed.items.filter((i) => i.text.trim() === '').length;
  const ai = ed.items.filter((i) => i.ai && i.text.trim() !== '').length;
  const checked = ed.items.filter((i) => i.checked && i.text.trim() !== '').length;
  const pending = ed.items.filter((i) => i.pending).length;
  return { done: ed.items.length - empty - ai, total: ed.items.length, missing: empty, ai, checked, pending };
}

function renderEditor() {
  const ed = S.ed;
  // Published stays editable now too — corrections save straight to the
  // live app without moving the language back through review. Only
  // "in_review" (genuinely awaiting an admin decision) stays locked.
  const isAdminView = S.role === 'admin';
  const editable = ed.status === 'draft' || ed.status === 'published';
  const E = ed.els = {};

  E.saveState = h('span', { class: 'savestate', 'aria-live': 'polite' });

    const ta = ev.target; if (!(ta instanceof HTMLTextAreaElement) || ta.readOnly) return;

    type: 'button', class: 'chip', 'aria-pressed': String(ed.filter === key), data: { f: key },
onclick: () => {

    }
  }, label);
  E.chips = h('div', { class: 'chips' },

  E.search = h('input', { class: 'input search', type: 'search', placeholder: t('searchShort'), 'aria-label': t('search'),
oninput: (ev) => { ed.q = ev.target.value.trim().toLowerCase(); ed.page = 0; applyFilters(); } });

  const actions = h('div', { class: 'actions' });
  const isAdmin = S.role === 'admin';
  if (ed.status === 'draft') {
    if (isAdmin && !S.noAi && edCounts().missing > 0) actions.append(h('button', { class: 'btn sm', type: 'button', id: 'aibtn', onclick: doAi }, t('aiButton')));
    actions.append(h('button', { class: 'btn sm', type: 'button', onclick: jumpNextPending }, t('nextPending')));

  } else if (ed.status === 'in_review' && isAdmin) {

  } else if (ed.status === 'published' && isAdmin) {

    }, sizeOpt(10, '10'), sizeOpt(25, '25'), sizeOpt(50, '50'), sizeOpt(100, '100'), sizeOpt('all', t('pageAll')));
    ed.pagePrev = h('button', { class: 'btn sm', type: 'button', onclick: () => { ed.page--; refreshBatch(); scrollToList(); } }, t('pagePrev'));

  const aiLeft = edCounts().ai;

    E.gauge,

function autosize(ta) { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; }
async function doSendBatch() {
  const ed = S.ed; const targets = (ed.batchIds || []).map((id) => ed.byId.get(id)).filter((it) => it && !it.checked);
  if (!targets.length) return;
  ed.sendBtn.disabled = true;
  const rows = targets.map((it) => ({ app_code: APP, lang: ed.lang, id_text: it.id, text: it.text, ai: false, checked: true }));
  const { error } = await S.sb.from('translation_drafts').upsert(rows, { onConflict: 'app_code,lang,id_text' });
  if (error) { toast(t('genericError', { msg: errMsg(error) }), true); ed.sendBtn.disabled = false; return; }
  for (const it of targets) { it.ai = false; it.checked = true; refreshItem(it); }
  refreshCounts(); applyFilters();
  toast(t('sendBatchDone', { n: targets.length }));
}
async function doDeleteLang() {
  const ed = S.ed;
  if (!confirm(t('deleteLangConfirm', { name: ed.name, code: ed.lang }))) return;
  const { error } = await S.sb.rpc('delete_language', { p_app: APP, p_lang: ed.lang });
  if (error) { toast(t('genericError', { msg: errMsg(error) }), true); return; }
  toast(t('deleteLangDone')); renderHome();
}

function refreshItem(it) {
  const filled = it.text.trim() !== '';
  const ai = it.ai && filled;
  const sent = it.checked && filled && !ai;
  it.tick.className = 't' + (it.warn ? ' warn' : it.pending ? ' pending' : ai ? ' ai' : sent ? ' sent' : filled ? ' done' : '');
  it.flag.hidden = !it.warn;
  it.aimark.hidden = !ai;
  if (it.pendingmark) it.pendingmark.hidden = !it.pending;
  it.row.classList.toggle('isai', ai);
  it.row.classList.toggle('ischecked', sent);
  it.row.classList.toggle('ispending', !!it.pending);
}
function confirmAi(it) { it.ai = false; it.checked = true; refreshItem(it); refreshCounts(); applyFilters(); scheduleSave(it); saveItem(it); }

function refreshCounts() {
  const { done, total, ai, checked, pending } = edCounts();
  const E = S.ed.els;
  const txt = ai ? t('gaugeInfoAi', { done, total, ai }) : t('gaugeInfo', { done, total });
  E.gaugeInfo.textContent = txt;
  E.gauge.setAttribute('aria-label', txt);
  if (E.checkedInfo) E.checkedInfo.textContent = t('checkedProgress', { n: checked, total });
  if (E.pendingInfo) E.pendingInfo.hidden = pending === 0; if (E.pendingInfo) E.pendingInfo.textContent = t('pendingCorrections', { n: pending });
}

function matchesFilter(ed, it) {
  const filled = it.text.trim() !== '', ai = it.ai && filled;
  let ok = ed.filter === 'all' || (ed.filter === 'pending' && !filled) || (ed.filter === 'done' && filled && !ai) || (ed.filter === 'ai' && ai) || (ed.filter === 'warn' && it.warn);
  if (ok && ed.q) ok = it.en.toLowerCase().includes(ed.q) || it.text.toLowerCase().includes(ed.q) || it.id === ed.q;
  return ok;
}
function applyFilters() {
  const ed = S.ed, E = ed.els;
  const matched = ed.items.filter((it) => matchesFilter(ed, it));
  const size = ed.pageSize === 'all' ? matched.length || 1 : ed.pageSize;
  const maxPage = Math.max(0, Math.ceil(matched.length / size) - 1);
  if (ed.page > maxPage) ed.page = maxPage;
  if (ed.page < 0) ed.page = 0;
  const from = ed.page * size, visible = matched.slice(from, from + size), slice = new Set(visible.map((it) => it.id));
  for (const it of ed.items) {
    const ok = slice.has(it.id);
    it.row.hidden = !ok; if (ok) autosizeIfNeeded(it.ta);
  }
  E.showing.textContent = t('showing', { n: matched.length });
  E.empty.hidden = matched.length !== 0;
  if (ed.pageInfo) {
    ed.pageInfo.textContent = matched.length ? t('pageInfo', { from: from + 1, to: Math.min(from + size, matched.length), n: matched.length }) : t('pageInfo', { from: 0, to: 0, n: 0 });
    ed.pagePrev.disabled = ed.page <= 0; ed.pageNext.disabled = ed.page >= maxPage;
  }
  updateBatchButton(visible);
}
function autosizeIfNeeded(ta) { if (ta.offsetParent !== null) autosize(ta); }
function updateBatchButton(visible) {
  const ed = S.ed; if (!ed.sendBtn) return;
  ed.batchIds = visible.map((it) => it.id);
  const pending = visible.filter((it) => !it.checked).length;
  ed.sendBtn.disabled = pending === 0;
  ed.sendBtn.textContent = t('sendBatch') + ' (' + visible.length + ')';
  ed.sendInfo.textContent = pending === 0 ? t('batchAllSent') : t('batchPending', { n: pending, total: visible.length });
}
function refreshBatch() { applyFilters(); }
function scrollToList() { const ed = S.ed; if (ed && ed.els && ed.els.list) ed.els.list.scrollIntoView({ block: 'start', behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }

function jumpTo(id) {
  const it = S.ed.byId.get(id); if (!it) return;
  if (it.row.hidden) { S.ed.filter = 'all'; S.ed.q = ''; S.ed.els.search.value = ''; for (const c of S.ed.els.chips.children) c.setAttribute('aria-pressed', String(c.dataset.f === 'all')); applyFilters(); }
  it.row.scrollIntoView({ block: 'start', behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  it.row.classList.remove('flash'); void it.row.offsetWidth; it.row.classList.add('flash');
  if (!it.ta.readOnly) it.ta.focus({ preventScroll: true });
}
function jumpNextPending() {
  const ed = S.ed; const needs = (i) => i.text.trim() === '' || i.ai; const pending = ed.items.filter(needs);
  if (!pending.length) return;
  const active = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.id : null;
  const idx = active ? ed.items.findIndex((i) => i.id === active) : -1;
  const next = ed.items.slice(idx + 1).find(needs) || pending[0];
  jumpTo(next.id);
}

/* ------------------------ pre-traducción con IA ------------------------ */
async function fnMsg(error) {
  try { if (error.context && typeof error.context.json === 'function') { const j = await error.context.json(); if (j && j.error) return j.error; } } catch (e) { /* sin cuerpo */ }
  return errMsg(error);
}
async function doAi() {
  const ed = S.ed;
  if (!(await flushAll())) { toast(t('unsaved'), true); return; }
  const { missing } = edCounts(); if (!missing) return;
  if (!confirm(t('aiConfirm', { n: missing, name: ed.name }))) return;
  const btn = document.getElementById('aibtn'); if (btn) btn.disabled = true;
  ed.els.list.inert = true;                       // mientras trabaja la IA no se edita
  const lang = ed.lang; let left = missing, total = 0, stopped = '';
  for (let guard = 0; left > 0 && guard < 60; guard++) {
    ed.els.saveState.classList.remove('err'); ed.els.saveState.textContent = t('aiRunning', { n: left });
    const { data, error } = await S.sb.functions.invoke('pretranslate', { body: { app_code: APP, lang } });
    if (error) { stopped = await fnMsg(error); break; }
    if (data && data.error) { stopped = data.error; break; }
    if (!data || !data.translated) { stopped = t('aiStalled'); break; }
    total += data.translated; left = data.remaining;
  }
  toast(stopped ? t('aiStopped', { msg: stopped }) : t('aiDone', { n: total }), !!stopped);
  if (S.ed && S.ed.lang === lang) openEditor(lang);
}

/* --------------------------- guardado --------------------------- */
function updateSaveState() {
  const ed = S.ed; if (!ed) return; const el = ed.els.saveState; if (!el) return;
  el.classList.toggle('err', !!ed.lastError);
  if (ed.lastError) el.textContent = t('saveError', { msg: ed.lastError });
  else if (ed.dirty.size || ed.inflight) el.textContent = t('saving');
  else el.textContent = t('saved');
}
function scheduleSave(it) {
  const ed = S.ed; clearTimeout(ed.timers.get(it.id)); ed.dirty.add(it.id);
  ed.timers.set(it.id, setTimeout(() => saveItem(it), 900)); updateSaveState();
}
async function saveItem(it) {
  const ed = S.ed; clearTimeout(ed.timers.get(it.id)); ed.timers.delete(it.id);
  const sent = it.text; ed.inflight++; updateSaveState();
  const row = { app_code: APP, lang: ed.lang, id_text: it.id, text: sent };
  if (!S.noAi) row.ai = !!(it.ai && sent.trim() !== '');
  if (!S.noChecked) row.checked = !!(it.checked && sent.trim() !== '');
  const { error } = await S.sb.from('translation_drafts').upsert(row, { onConflict: 'app_code,lang,id_text' });
  ed.inflight--;
  if (error) { ed.lastError = errMsg(error); }
  else { ed.lastError = ''; if (it.text === sent && !ed.timers.has(it.id)) ed.dirty.delete(it.id); }
  if (S.ed === ed) updateSaveState();
  return !error;
}
async function flushAll() {
  const ed = S.ed; if (!ed) return true;
  const pend = [...ed.timers.keys()].map((id) => saveItem(ed.byId.get(id)));
  const res = await Promise.all(pend);
  while (ed.inflight) await new Promise((r) => setTimeout(r, 50));
  return res.every(Boolean) && !ed.lastError && ed.dirty.size === 0;
}
window.addEventListener('beforeunload', (ev) => { if (S.ed && S.ed.dirty.size) { ev.preventDefault(); ev.returnValue = ''; } });

/* --------------------------- acciones --------------------------- */
async function goHome() {
  if (S.ed && !(await flushAll())) { if (!confirm(t('unsaved'))) return; }
  renderHome();
}
async function rpc(name, args, okMsg) {
  const { data, error } = await S.sb.rpc(name, args);
  if (error) { toast(t('genericError', { msg: errMsg(error) }), true); return null; }
  if (okMsg) toast(okMsg(data));
  return { data };
}
async function doSubmit() {
  if (!(await flushAll())) { toast(t('unsaved'), true); return; }
  const { missing, ai } = edCounts();
  const q = ai ? t('confirmSubmitIssues', { missing, ai }) : missing ? t('confirmSubmitMissing', { n: missing }) : t('confirmSubmit');
  if (!confirm(q)) return;
  if (await rpc('submit_language', { p_app: APP, p_lang: S.ed.lang }, () => t('toastSubmitted'))) openEditor(S.ed.lang);
}
async function doPublish() {
  if (!confirm(t('confirmPublish'))) return;
  const ed = S.ed;
  const r = await rpc('publish_language', { p_app: APP, p_lang: ed.lang }, (n) => t('toastPublished', { n }));
  if (r) {
    try { await uploadPublishedDico(ed); } catch (e) { console.error('No se pudo refrescar el CSV de Storage', e); }
    openEditor(ed.lang);
  }
}
async function doReturn(askNote) {
  let note = null;
  if (askNote) { note = prompt(t('notePrompt'), ''); if (note === null) return; }
  if (await rpc('return_to_draft', { p_app: APP, p_lang: S.ed.lang, p_note: note }, () => t('toastReturned'))) openEditor(S.ed.lang);
}
// Re-uploads the SAME already-published file (see uploadPublishedDico) with
// whatever's currently in the drafts table — the language's status never
// changes, so this is safe for anyone to use to fix a typo or small mistake,
// not just admins, and doesn't require another round of review.
async function doSaveCorrection() {
  if (!(await flushAll())) { toast(t('unsaved'), true); return; }
  const ed = S.ed;
  const r = await rpc('apply_correction', { p_app: APP, p_lang: ed.lang });
  if (!r) return;   // el error ya se ha mostrado dentro de rpc()
  try { await uploadPublishedDico(ed); } catch (e) { console.error('No se pudo refrescar el CSV de Storage', e); }   // mantiene también el CSV de Storage al día
  toast(t('toastCorrected'));
}
function buildCsvBlob(ed) {
  // Formato exacto que espera la app: "id";"en";"<lang>" con CRLF, igual que los .csv ya publicados.
  const q = (s) => '"' + String(s).replace(/"/g, '""') + '"';
  const lines = [[q('id'), q('en'), q(ed.lang)].join(';')];
  for (const it of ed.items) lines.push([q(it.id), q(it.en), q(it.text)].join(';'));
  return new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' });
}
function downloadCsv() {
  const ed = S.ed;
  const blob = buildCsvBlob(ed);
  const a = h('a', { href: URL.createObjectURL(blob), download: 'translated_' + APP + '_' + ed.lang + '_' + today() + '.csv' });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
// Sube a Storage el mismo fichero que publish_language acaba de registrar en translation_files,
// para que el "path" guardado en la base de datos corresponda siempre a un fichero real.
async function uploadPublishedDico(ed) {
  const { data: fileRow, error: fileErr } = await S.sb
    .from('translation_files')
    .select('path,bucket')
    .eq('app_code', APP).eq('lang', ed.lang)
    .order('created_at', { ascending: false })
    .limit(1)
    .maybeSingle();
  if (fileErr || !fileRow) {
    console.error('No se encontró el registro de fichero recién publicado', fileErr);
    toast(t('genericError', { msg: 'No se pudo localizar el fichero a subir' }), true);
    return false;
  }
  const blob = buildCsvBlob(ed);
  const { error: upErr } = await S.sb.storage
    .from(fileRow.bucket || 'Dicos')
    .upload(fileRow.path, blob, { contentType: 'text/csv', upsert: true });
  if (upErr) {
    console.error('Error subiendo el CSV publicado', upErr);
    toast(t('genericError', { msg: 'El idioma se publicó pero el fichero no se pudo subir: ' + errMsg(upErr) }), true);
    return false;
  }
  return true;
}

/* --------------------------- sesión --------------------------- */
async function signOut() { if (S.ed) await flushAll(); await S.sb.auth.signOut(); S.user = null; S.role = null; S.ed = null; renderLogin(); }

async function boot() {
  const { data } = await S.sb.auth.getSession();
  const session = data && data.session;
  if (!session) { S.user = null; return renderLogin(); }
  S.user = session.user;
  const { data: r, error } = await S.sb.from('translation_roles').select('role').eq('user_id', S.user.id).maybeSingle();
  if (error) { toast(t('genericError', { msg: errMsg(error) }), true); }
  S.role = r ? r.role : null;
  if (!S.role) return renderNoAccess();
  return renderHome();
}

function render() {
  if (!S.sb) return renderConfigError();
  if (!S.user) return renderLogin();
  if (!S.role) return renderNoAccess();
  if (S.view === 'editor' && S.ed) return renderEditor();
  return renderHome();
}

document.documentElement.lang = uiLang;
if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY || !window.supabase) {
  renderConfigError();
} else {
  S.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  boot();
}
})();
</script>
