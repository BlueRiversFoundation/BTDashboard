<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>BTV2 - Moderation Dashboard (TEST)</title>
  <!-- Bibliothèques -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --sidebar-width: 380px;
    }

    body,
    html {
      height: 100%;
      margin: 0;
      background: #1a1c1e;
      overflow: hidden;
    }

    /* Login */
    #auth-container {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      position: relative;
    }

    .login-card {
      background: white;
      padding: 40px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      color: #333;
    }

    /* Dashboard Layout */
    #dashboard-ui {
      display: none;
      height: 100vh;
      flex-direction: row;
      background: #f4f4f4;
    }

    .sidebar {
      width: var(--sidebar-width);
      background: white;
      border-right: 1px solid #ccc;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      position: relative;
    }

    /* Éléments de liste */
    .record-item {
      padding: 10px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: 0.12s;
      display: grid;
      grid-template-rows: auto auto;
      gap: 6px;
      align-items: center;
    }

    .record-item:hover {
      background: #f8f9fa;
    }

    .record-item.active {
      background: #0d6efd !important;
      color: white !important;
    }

    .record-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
    }

    .record-bottom {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.85rem;
      color: #555;
    }

    /* Keep left photo visible while attributes scroll */
    .left-panel {
      position: sticky;
      top: 20px;
      align-self: flex-start;
    }

    .status-edit-fab {
      position: absolute;
      bottom: 6px;
      right: 6px;
    }

    .status-edit-fab button {
      width: 32px;
      height: 32px;
      padding: 0;
      opacity: 0.7;
    }

    .status-edit-fab button:hover {
      opacity: 1;
    }

    /* Custom flex row for things we show/hide from JS. Deliberately NOT using
       Bootstrap's .d-flex here: that utility is declared with !important, so
       toggling display:none from JS on a .d-flex element silently fails and
       the element stays visible. */
    .action-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .right-panel {
      display: flex;
      flex-direction: column;
    }

    /* Make attributes list scroll independently */
    #attributes-list {
      overflow: auto;
      max-height: calc(100vh - 420px);
    }

    /* Visualiseur */
    .photo-viewer {
      background: #000;
      height: 300px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      overflow: hidden;
    }

    #mainImg {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: zoom-in;
      transition: transform 0.15s ease;
    }

    .photo-controls {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 14px;
    }

    #map {
      height: 300px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .badge-state {
      font-size: 0.85rem;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 600;
      display: inline-block;
    }

    /* Resumen fijo con la info clave */
    #summary-block {
      background: #f8f9fb;
      border: 1px solid #e3e6ea;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }

    #summary-block .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 3px 0;
      border-bottom: 1px dashed #e3e6ea;
    }

    #summary-block .summary-row:last-child {
      border-bottom: none;
    }

    #summary-block .summary-label {
      color: #6c757d;
      font-weight: 600;
    }

    /* Overlay image fullscreen */
    #img-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      flex-direction: column;
    }

    #img-overlay .overlay-img-wrap {
      max-width: 95%;
      max-height: 78%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #img-overlay img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.1s ease;
      cursor: grab;
    }

    #img-overlay .overlay-close {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 3100;
    }

    .overlay-controls {
      margin-top: 16px;
      display: flex;
      gap: 8px;
    }
  </style>
</head>

<body>

  <!-- 1. ÉCRAN DE LOGIN -->
  <div id="auth-container">
    <div class="login-card shadow-lg">
      <h3 class="text-center mb-4">Barrier Tracker Moderation</h3>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="login-email" class="form-control" placeholder="admin@btv2.com">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="login-pass" class="form-control">
      </div>
      <button class="btn btn-primary w-100" id="btn-login">login</button>
      <div id="login-error" class="text-danger mt-3 small text-center"></div>
    </div>
  </div>

  <!-- 2. DASHBOARD COMPLET -->
  <div id="dashboard-ui">
    <!-- Barre latérale -->
    <div class="sidebar">
      <div class="p-3 bg-dark text-white d-flex justify-content-between align-items-center">
        <strong border>BTV2 MOD test</strong>
        <button class="btn btn-sm btn-outline-danger" id="btn-logout">Logout</button>
      </div>
      <div class="p-3 border-bottom bg-light">
        <select id="filter-state" class="form-select form-select-sm">
          <option value="0">⏳ Pending (State 0)</option>
          <option value="1">✅ Validated (State 1)</option>
          <option value="2">❓ Unknown (State 2)</option>
          <option value="3">❌ Rejected (State 3)</option>
        </select>
        <div class="mt-2">
          <label class="form-label small mb-1">Filter by type</label>
          <select id="filter-type" class="form-select form-select-sm">
            <option value="">All types</option>
          </select>
        </div>

        <div class="mt-2">
          <label class="form-label small mb-1">Filter by user</label>
          <select id="filter-user" class="form-select form-select-sm">
            <option value="">All users</option>
          </select>
        </div>

        <div class="mt-2 d-grid">
          <button id="btn-export-csv" class="btn btn-sm btn-outline-success">
            📥 Download Excel (current list)
          </button>
        </div>
      </div>
      <div id="list-container" class="overflow-auto flex-grow-1">
        <!-- Les records s'affichent ici -->
      </div>
    </div>

    <!-- Zone d'inspection -->
    <div class="main-content">
      <div id="empty-msg" class="text-center mt-5 text-muted">
        <h4>Select a report to inspect</h4>
      </div>

      <div id="inspector" style="display: none;">
        <div class="row">
          <div class="col-lg-6 left-panel d-flex flex-column align-items-center">
            <div class="photo-viewer shadow-sm w-100 d-flex align-items-center justify-content-center">
              <img id="mainImg" src="" alt="Report photo">
            </div>
            <div id="img-debug" class="text-muted small mb-1"></div>

            <div class="photo-controls">
              <button class="btn btn-sm btn-outline-secondary" id="btn-rotate-left" title="Rotate left">⟲</button>
              <button class="btn btn-sm btn-outline-secondary" id="btn-rotate-right" title="Rotate right">⟳</button>
              <button class="btn btn-sm btn-outline-primary" id="btn-zoom-open" title="Zoom photo">🔍 Zoom</button>
            </div>

            <!-- Type + status actions below the photo -->
            <div class="text-center mt-2">
              <div id="status-badge-wrap" class="mb-2"></div>

              <div>
                <h2 id="display-type" class="fw-bold d-inline-block mb-0">--</h2>
                <button id="btn-edit-type" class="btn btn-sm btn-outline-secondary ms-1" title="Correct barrier type">✎</button>
              </div>

              <div id="type-edit-wrap" class="action-row" style="display:none;">
                <select id="type-edit-select" class="form-select form-select-sm" style="max-width:220px;"></select>
                <button id="btn-type-save" class="btn btn-sm btn-primary">Save</button>
                <button id="btn-type-cancel" class="btn btn-sm btn-outline-secondary">Cancel</button>
              </div>
              <div id="type-edit-msg" class="small text-muted mt-1"></div>

              <div id="status-actions" class="action-row">
                <button id="btn-ok" class="btn btn-success btn-lg" onclick="changeStatus(1)">OK</button>
                <button id="btn-no" class="btn btn-danger btn-lg" onclick="changeStatus(3)">NO</button>
                <button id="btn-noidea" class="btn btn-secondary btn-lg" onclick="changeStatus(2)">I DON'T KNOW</button>
              </div>

              <!-- Compact status change UI, only shown via the small pencil once a
                   record has already been moderated — deliberately NOT the big
                   OK/NO/I DON'T KNOW buttons, so it doesn't look like a fresh pending item. -->
              <div id="status-edit-wrap" class="action-row" style="display:none;">
                <select id="status-edit-select" class="form-select form-select-sm" style="max-width:170px;">
                  <option value="0">⏳ Pending</option>
                  <option value="1">✅ Validated</option>
                  <option value="2">❓ Unknown</option>
                  <option value="3">❌ Rejected</option>
                </select>
                <button id="btn-status-save" class="btn btn-sm btn-primary">Save</button>
                <button id="btn-status-cancel" class="btn btn-sm btn-outline-secondary">Cancel</button>
              </div>
            </div>

            <div id="status-edit-toggle" class="status-edit-fab" style="display:none;">
              <button id="btn-edit-status" class="btn btn-sm btn-outline-secondary rounded-circle" title="Edit status">✎</button>
            </div>
          </div>

          <div class="col-lg-6 right-panel d-flex flex-column">
            <!-- Carte en haut -->
            <div id="map" class="shadow-sm mb-3"></div>

            <!-- Resumen fijo: país, coordenadas, tipo... siempre visible -->
            <div id="summary-block">
              <div class="summary-row"><span class="summary-label">Country</span><span id="sum-country">--</span></div>
              <div class="summary-row"><span class="summary-label">City</span><span id="sum-city">--</span></div>
              <div class="summary-row"><span class="summary-label">Coordinates</span><span id="sum-coords">--</span></div>
              <div class="summary-row"><span class="summary-label">Barrier type</span><span id="sum-type">--</span></div>
              <div class="summary-row"><span class="summary-label">Date</span><span id="sum-date">--</span></div>
              <div class="summary-row"><span class="summary-label">User</span><span id="sum-user">--</span></div>
            </div>

            <!-- Données/Attributs en dessous de la carte (scroll indépendant) -->
            <div class="card p-3 mb-3 shadow-sm flex-grow-1 d-flex flex-column">
              <div class="d-flex justify-content-between align-items-center">
                <button id="toggle-details" class="btn btn-sm btn-link p-0">View more details ▾</button>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="show-tech">
                  <label class="form-check-label small text-muted" for="show-tech">Show technical fields</label>
                </div>
              </div>
              <div id="attributes-list" class="row g-2 mt-2 small text-dark flex-grow-1" style="overflow:auto; display:none;">
                <!-- Filled by JS with non-null fields from records + record_details -->
              </div>
              <div id="fields-selector" class="row g-1 mt-3 small text-dark" style="max-height:160px; overflow:auto; display:none;">
                <!-- List of fields (checkboxes) will be filled here -->
              </div>
              <div class="mt-2" id="fields-config-wrap" style="display:none;">
                <label class="form-label small">Available fields (1 per line — edit here)</label>
                <textarea id="fields-config" class="form-control form-control-sm" rows="6">record_maintype
  user_name
  gps_latitude
  gps_longitude
  media_file_name
  media_annual_link
  record_created_utc
  record_id
  user_email
  user_id
  source
  severity
  note
  category
  tags
  status
  owner
  location
  city
  country</textarea>
                <div class="text-end mt-1">
                  <button id="reload-fields" class="btn btn-sm btn-outline-primary">Recharger champs</button>
                  <button id="save-fields" class="btn btn-sm btn-primary ms-2">Enregistrer sélection</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Overlay image fullscreen -->
  <div id="img-overlay" style="display:none;">
    <button class="btn btn-light overlay-close" id="overlay-close">Close</button>
    <div class="overlay-img-wrap">
      <img id="overlay-img" src="" alt="Enlarged photo">
    </div>
    <div class="overlay-controls">
      <button class="btn btn-light btn-sm" id="overlay-rotate-left">⟲ Rotate</button>
      <button class="btn btn-light btn-sm" id="overlay-rotate-right">⟳ Rotate</button>
      <button class="btn btn-light btn-sm" id="overlay-zoom-out">➖ Zoom out</button>
      <button class="btn btn-light btn-sm" id="overlay-zoom-in">➕ Zoom in</button>
      <button class="btn btn-light btn-sm" id="overlay-zoom-reset">Reset</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script>
    const S_URL = 'https://fuaujvjyyuuarvghhrkk.supabase.co';
    const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1YXVqdmp5eXV1YXJ2Z2hocmtrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3MTE5MDEsImV4cCI6MjA3OTI4NzkwMX0.hDzjIOxB5TQoCP12eJJrF72hUh3AHvH7Z1u4kL7TL_k';

    let _supabase;
    let currentRecords = [];
    let allBarrierTypes = []; // filled in populateFilters, used by the type-correction dropdown
    let currentIndex = -1;
    let map, marker;

    // Estado de rotación/zoom de la foto
    let mainRotation = 0;
    let overlayZoom = 1;

    document.addEventListener('DOMContentLoaded', async () => {
      _supabase = supabase.createClient(S_URL, S_KEY);

      // Liaison des boutons
      document.getElementById('btn-login').onclick = handleLogin;
      document.getElementById('btn-logout').onclick = handleLogout;
      document.getElementById('filter-state').onchange = loadRecords;
      const typeFilter = document.getElementById('filter-type'); if (typeFilter) typeFilter.onchange = loadRecords;
      const userFilter = document.getElementById('filter-user'); if (userFilter) userFilter.onchange = loadRecords;
      const reloadBtn = document.getElementById('reload-fields');
      if (reloadBtn) reloadBtn.onclick = () => { if (currentIndex !== -1) selectRecord(currentIndex); };
      const saveBtn = document.getElementById('save-fields');
      if (saveBtn) saveBtn.onclick = () => {
        const fieldsEl = document.getElementById('fields-selector');
        if (!fieldsEl) return;
        const selected = Array.from(fieldsEl.querySelectorAll('.field-choice')).filter(x => x.checked).map(x => x.getAttribute('data-key'));
        document.getElementById('fields-config').value = selected.join('\n');
      };

      // Descargar CSV de la lista actual (según filtros aplicados)
      const exportBtn = document.getElementById('btn-export-csv');
      if (exportBtn) exportBtn.onclick = exportCurrentListToExcel;

      // Mostrar/ocultar el bloque de "más detalles" (para no saturar la vista)
      const toggleDetailsBtn = document.getElementById('toggle-details');
      if (toggleDetailsBtn) toggleDetailsBtn.onclick = () => {
        const attrsEl = document.getElementById('attributes-list');
        const fieldsEl = document.getElementById('fields-selector');
        const fieldsConfigWrap = document.getElementById('fields-config-wrap');
        const isHidden = attrsEl.style.display === 'none';
        attrsEl.style.display = isHidden ? '' : 'none';
        if (fieldsEl) fieldsEl.style.display = isHidden ? '' : 'none';
        if (fieldsConfigWrap) fieldsConfigWrap.style.display = isHidden ? '' : 'none';
        toggleDetailsBtn.innerText = isHidden ? 'View less details ▴' : 'View more details ▾';
      };

      // Rotar/ampliar foto principal
      document.getElementById('btn-rotate-left').onclick = () => rotateMainImg(-90);
      document.getElementById('btn-rotate-right').onclick = () => rotateMainImg(90);
      document.getElementById('btn-zoom-open').onclick = openOverlay;

      // Controles del overlay (foto ampliada)
      document.getElementById('overlay-rotate-left').onclick = () => { mainRotation = (mainRotation - 90 + 360) % 360; applyImgTransforms(); };
      document.getElementById('overlay-rotate-right').onclick = () => { mainRotation = (mainRotation + 90) % 360; applyImgTransforms(); };
      document.getElementById('overlay-zoom-in').onclick = () => { overlayZoom = Math.min(overlayZoom + 0.25, 4); applyImgTransforms(); };
      document.getElementById('overlay-zoom-out').onclick = () => { overlayZoom = Math.max(overlayZoom - 0.25, 0.5); applyImgTransforms(); };
      document.getElementById('overlay-zoom-reset').onclick = () => { overlayZoom = 1; applyImgTransforms(); };
      const overlayImgEl = document.getElementById('overlay-img');
      overlayImgEl.addEventListener('wheel', (ev) => {
        ev.preventDefault();
        overlayZoom = Math.min(4, Math.max(0.5, overlayZoom + (ev.deltaY < 0 ? 0.15 : -0.15)));
        applyImgTransforms();
      }, { passive: false });
      overlayImgEl.addEventListener('dblclick', () => { overlayZoom = 1; applyImgTransforms(); });

      // Vérifier session
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) showDashboard();
    });

    async function handleLogin() {
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-pass').value;
      const { error } = await _supabase.auth.signInWithPassword({ email, password: pass });
      if (error) document.getElementById('login-error').innerText = error.message;
      else showDashboard();
    }

    async function handleLogout() {
      await _supabase.auth.signOut();
      location.reload();
    }

    function showDashboard() {
      document.getElementById('auth-container').classList.add('d-none');
      document.getElementById('dashboard-ui').style.display = 'flex';
      initMap();
      // Remplir les listes de filtres puis charger les enregistrements
      populateFilters().then(() => loadRecords());
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // --- Utilidades para leer campos "país" / "ciudad" aunque el nombre de columna varíe ---
    function firstNonEmpty(obj, keys) {
      if (!obj) return null;
      for (const k of keys) {
        if (obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== '') return obj[k];
      }
      return null;
    }

    // Reverse geocoding (coordinates -> country/city) using OpenStreetMap's
    // Nominatim, with a simple cache so we don't look up the same spot twice.
    // This is only called once per selected record (not for whole lists/CSV
    // exports), to stay within Nominatim's free usage policy of ~1 request/sec
    // and no bulk/batch geocoding: https://operations.osmfoundation.org/policies/nominatim/
    const geocodeCache = {};
    async function reverseGeocode(lat, lon) {
      const key = lat.toFixed(3) + ',' + lon.toFixed(3);
      if (geocodeCache[key]) return geocodeCache[key];
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=10&addressdetails=1&accept-language=en`);
        if (!res.ok) throw new Error('Nominatim request failed: ' + res.status);
        const data = await res.json();
        const addr = data.address || {};
        const result = {
          country: addr.country || null,
          city: addr.city || addr.town || addr.village || addr.municipality || addr.county || null
        };
        geocodeCache[key] = result;
        return result;
      } catch (ex) {
        console.warn('Reverse geocoding failed', ex);
        return { country: null, city: null };
      }
    }

    async function populateFilters() {
      try {
        const { data, error } = await _supabase.schema('btv2').from('records').select('record_maintype,user_name').limit(2000);
        if (error || !data) return;
        const types = new Set();
        const users = new Set();
        data.forEach(r => { if (r && r.record_maintype) types.add(r.record_maintype); if (r && r.user_name) users.add(r.user_name); });
        allBarrierTypes = Array.from(types).sort();

        const typeEl = document.getElementById('filter-type');
        if (typeEl) {
          const opts = ['<option value="">All types</option>'].concat(Array.from(types).sort().map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`));
          typeEl.innerHTML = opts.join('');
          typeEl.disabled = false;
        }

        const userEl = document.getElementById('filter-user');
        if (userEl) {
          const uopts = ['<option value="">All users</option>'].concat(Array.from(users).sort().map(u => `<option value="${escapeHtml(u)}">${escapeHtml(u)}</option>`));
          userEl.innerHTML = uopts.join('');
          userEl.disabled = false;
        }
      } catch (ex) {
        console.warn('populateFilters failed', ex);
      }
    }

    function initMap() {
      if (!map) {
        map = L.map('map').setView([46, 2], 5);
        // CARTO's free anonymous basemaps now require an API key (that's the
        // "API key required" message you saw), so switched to Esri's basemap
        // tiles, which are free for this kind of low-volume internal-tool use
        // and don't need any signup or key.
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
          attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ',
          maxZoom: 19
        }).addTo(map);
      }
    }

    async function loadRecords() {
      const state = document.getElementById('filter-state').value;
      const typeVal = document.getElementById('filter-type') ? document.getElementById('filter-type').value : '';
      const userVal = document.getElementById('filter-user') ? document.getElementById('filter-user').value : '';

      let query = _supabase.schema('btv2').from('records').select('*');
      if (state !== '' && state !== null) query = query.eq('state', parseInt(state));
      if (typeVal) query = query.eq('record_maintype', typeVal);
      if (userVal) query = query.eq('user_name', userVal);
      const { data, error } = await query.order('record_created_utc', { ascending: false });

      if (!error) {
        currentRecords = data;
        currentIndex = -1;
        const inspector = document.getElementById('inspector');
        if (inspector) inspector.style.display = 'none';
        const emptyMsg = document.getElementById('empty-msg');
        if (emptyMsg) emptyMsg.classList.remove('d-none');
        if (marker) { try { map.removeLayer(marker); } catch (e) { } marker = null; }
        const imgEl = document.getElementById('mainImg'); if (imgEl) imgEl.removeAttribute('src');
        const attrsEl = document.getElementById('attributes-list'); if (attrsEl) attrsEl.innerHTML = '';
        renderList();
      } else {
        console.error('loadRecords error', error);
      }
    }

    function renderList() {
      const container = document.getElementById('list-container');
      container.innerHTML = currentRecords.map((r, i) => `
                <div class="record-item ${currentIndex === i ? 'active' : ''}" onclick="selectRecord(${i})">
                    <div class="record-top">
                      <div class="fw-bold text-truncate">${effectiveType(r) || ''}</div>
                      <div class="small opacity-75">${new Date(r.record_created_utc).toLocaleDateString()}</div>
                    </div>
                    <div class="record-bottom">
                      <div class="text-truncate">${r.user_name || 'Anonyme'}</div>
                      <div class="text-truncate">${r.user_name || 'Anonyme'}</div>
                    </div>
                </div>
            `).join('');
    }

    function rotateMainImg(delta) {
      mainRotation = (mainRotation + delta + 360) % 360;
      applyImgTransforms();
    }

    function applyImgTransforms() {
      const mainImg = document.getElementById('mainImg');
      const overlayImg = document.getElementById('overlay-img');
      if (mainImg) mainImg.style.transform = `rotate(${mainRotation}deg)`;
      if (overlayImg) overlayImg.style.transform = `rotate(${mainRotation}deg) scale(${overlayZoom})`;
    }

    function openOverlay() {
      const overlay = document.getElementById('img-overlay');
      const overlayImg = document.getElementById('overlay-img');
      const mainImg = document.getElementById('mainImg');
      if (!overlay || !mainImg.src) return;
      overlayImg.src = mainImg.src;
      overlayZoom = 1;
      applyImgTransforms();
      overlay.style.display = 'flex';
    }

    // --- Status badge + OK/NO/I DON'T KNOW visibility ---
    // Pending records (state 0) show the moderation buttons right away.
    // Already-moderated records (state 1/2/3) show a clear status badge instead,
    // with a small "Edit status" link to reveal the buttons again if a correction is needed.
    const STATE_INFO = {
      0: { label: '⏳ Pending', cls: 'bg-warning text-dark' },
      1: { label: '✅ Validated', cls: 'bg-success text-white' },
      2: { label: '❓ Unknown', cls: 'bg-secondary text-white' },
      3: { label: '❌ Rejected', cls: 'bg-danger text-white' }
    };

    function renderStatusUI(r) {
      const info = STATE_INFO[r.state] || { label: 'State ' + r.state, cls: 'bg-secondary text-white' };
      document.getElementById('status-badge-wrap').innerHTML = `<span class="badge-state ${info.cls}">${info.label}</span>`;

      const actions = document.getElementById('status-actions');
      const editWrap = document.getElementById('status-edit-wrap');
      const editToggleWrap = document.getElementById('status-edit-toggle');
      const editBtn = document.getElementById('btn-edit-status');
      const select = document.getElementById('status-edit-select');
      const saveBtn = document.getElementById('btn-status-save');
      const cancelBtn = document.getElementById('btn-status-cancel');

      editWrap.style.display = 'none';

      if (r.state === 0) {
        // Pending: show the big, unmissable moderation buttons as usual.
        actions.style.display = 'flex';
        editToggleWrap.style.display = 'none';
      } else {
        // Already moderated: no big buttons, just the badge + a small pencil.
        actions.style.display = 'none';
        editToggleWrap.style.display = 'block';
      }

      editBtn.onclick = () => {
        select.value = String(r.state);
        editToggleWrap.style.display = 'none';
        editWrap.style.display = 'flex';
      };

      cancelBtn.onclick = () => {
        editWrap.style.display = 'none';
        editToggleWrap.style.display = 'block';
      };

      saveBtn.onclick = () => {
        changeStatus(parseInt(select.value, 10));
      };
    }

    // --- Barrier type correction ---
    // Lets a moderator fix the type a user picked (e.g. they said "culvert" but
    // the photo clearly shows a "ford") directly from the dashboard.
    function setupTypeEditor(r) {
      const editBtn = document.getElementById('btn-edit-type');
      const wrap = document.getElementById('type-edit-wrap');
      const select = document.getElementById('type-edit-select');
      const msgEl = document.getElementById('type-edit-msg');
      const saveBtn = document.getElementById('btn-type-save');
      const cancelBtn = document.getElementById('btn-type-cancel');

      msgEl.innerText = '';
      wrap.style.display = 'none';

      function buildOptions() {
        const opts = new Set(allBarrierTypes);
        if (r.record_maintype) opts.add(r.record_maintype);
        if (r.record_maintype_corrected) opts.add(r.record_maintype_corrected);
        const current = effectiveType(r);
        select.innerHTML = Array.from(opts).sort().map(t =>
          `<option value="${escapeHtml(t)}" ${t === current ? 'selected' : ''}>${escapeHtml(t)}</option>`
        ).join('');
      }

      editBtn.onclick = () => {
        buildOptions();
        wrap.style.display = 'flex';
      };

      cancelBtn.onclick = () => {
        wrap.style.display = 'none';
        msgEl.innerText = '';
      };

      saveBtn.onclick = async () => {
        const newType = select.value;
        const previousEffective = effectiveType(r);
        if (newType === previousEffective) { wrap.style.display = 'none'; return; }

        // We never touch `record_maintype` — that stays exactly as the user
        // submitted it. The correction goes in `record_maintype_corrected`,
        // which is what the dashboard/export treat as the "final" value.
        // Requires this column to exist in Supabase (see the SQL note).
        const newCorrectedValue = (newType === r.record_maintype) ? null : newType;

        saveBtn.disabled = true;
        msgEl.innerText = 'Saving…';
        try {
          const { error } = await _supabase.schema('btv2').from('records')
            .update({ record_maintype_corrected: newCorrectedValue }).eq('record_id', r.record_id);
          if (error) throw error;

          r.record_maintype_corrected = newCorrectedValue;
          const finalType = effectiveType(r);
          document.getElementById('display-type').innerText = finalType;
          document.getElementById('sum-type').innerText = finalType;
          wrap.style.display = 'none';
          msgEl.innerText = newCorrectedValue
            ? `Corrected from "${r.record_maintype}" (original) to "${newCorrectedValue}".`
            : `Correction cleared — back to the original "${r.record_maintype}".`;
          renderList();

          // Notify the user that their entry was corrected — see notifyUserOfCorrection().
          if (newCorrectedValue) notifyUserOfCorrection(r, r.record_maintype, newCorrectedValue);
        } catch (ex) {
          console.error('Failed to save type correction', ex);
          msgEl.innerText = 'Error saving correction: ' + (ex.message || JSON.stringify(ex)) +
            ' — make sure the "record_maintype_corrected" column exists in the records table.';
        } finally {
          saveBtn.disabled = false;
        }
      };
    }

    // Placeholder: wire this up to however the app actually delivers
    // notifications (a table the app polls, a push service, etc.) once that's
    // decided. For now it just logs the correction so nothing breaks.
    function notifyUserOfCorrection(r, oldType, newType) {
      console.log(`TODO: notify ${r.user_name || r.user_id} that record ${r.record_id} was corrected from "${oldType}" to "${newType}".`);
    }

    async function selectRecord(index) {
      currentIndex = index;
      const r = currentRecords[index];
      renderList();

      document.getElementById('empty-msg').classList.add('d-none');
      document.getElementById('inspector').style.display = 'block';

      // Reset de rotación/zoom al cambiar de foto
      mainRotation = 0;
      overlayZoom = 1;

      const imgEl = document.getElementById('mainImg');
      const debugEl = document.getElementById('img-debug');
      applyImgTransforms();

      imgEl.onload = () => {
        if (debugEl) debugEl.innerText = '';
      };
      imgEl.onerror = null;

      function normalizeUrl(u) {
        if (!u) return null;
        u = String(u).trim();
        if (!u) return null;
        if (u.toLowerCase().startsWith('file:')) return null;
        if (u.startsWith('//')) return 'https:' + u;
        if (/^https?:\/\//i.test(u)) return u;
        if (u.startsWith('/')) return S_URL + u;
        return u;
      }

      const placeholder = 'https://via.placeholder.com/900x600?text=No+photo';
      let triedStorage = false;

      function setStorageSrc() {
        triedStorage = true;
        const d = new Date(r.record_created_utc);
        const folder = `${d.getFullYear()}_${String(d.getMonth() + 1).padStart(2, '0')}`;
        imgEl.onerror = () => { imgEl.onerror = null; imgEl.src = placeholder; };
        imgEl.src = `${S_URL}/storage/v1/object/public/BTV2_Photos/${folder}/${r.media_file_name}`;
      }

      const candidateRaw = r.media_annual_link ? String(r.media_annual_link).trim() : '';
      const candidate = normalizeUrl(candidateRaw);
      const isAbsoluteHttp = candidate && (/^https?:\/\//i.test(candidate) || candidate.startsWith('data:') || candidate.startsWith('blob:'));

      if (isAbsoluteHttp) {
        imgEl.onerror = (ev) => {
          if (!triedStorage) setStorageSrc();
          else { imgEl.onerror = null; imgEl.src = placeholder; }
        };
        imgEl.src = candidate;
      } else if (candidateRaw) {
        if (!r.media_file_name) r.media_file_name = candidateRaw;
        setStorageSrc();
      } else {
        setStorageSrc();
      }

      document.getElementById('display-type').innerText = effectiveType(r) || '--';
      renderStatusUI(r);
      setupTypeEditor(r);

      // Carte
      if (r.gps_latitude && r.gps_longitude) {
        const pos = [r.gps_latitude, r.gps_longitude];
        if (marker) map.removeLayer(marker);
        marker = L.marker(pos).addTo(map);
        map.setView(pos, 14);
        setTimeout(() => map.invalidateSize(), 200);
      }

      // Détails techniques
      const { data: details } = await _supabase.schema('btv2').from('record_details').select('*').eq('record_id', r.record_id).maybeSingle();

      // Fill in the fixed summary (country, city, coordinates, type, date, user).
      // If there's no dedicated country/city column, we resolve it automatically
      // from the coordinates (reverse geocoding) further down.
      const explicitCountry = firstNonEmpty(r, ['country', 'pais', 'gps_country', 'location_country']) || firstNonEmpty(details, ['country', 'pais']);
      const explicitCity = firstNonEmpty(r, ['city', 'ciudad', 'location_city']) || firstNonEmpty(details, ['city', 'ciudad']);
      document.getElementById('sum-country').innerText = explicitCountry || (r.gps_latitude && r.gps_longitude ? 'Loading…' : '—');
      document.getElementById('sum-city').innerText = explicitCity || (r.gps_latitude && r.gps_longitude ? 'Loading…' : '—');
      document.getElementById('sum-coords').innerHTML = (r.gps_latitude && r.gps_longitude)
        ? `<a href="https://www.google.com/maps?q=${r.gps_latitude},${r.gps_longitude}" target="_blank">${r.gps_latitude}, ${r.gps_longitude}</a>`
        : '—';
      document.getElementById('sum-type').innerText = effectiveType(r) || '—';
      document.getElementById('sum-date').innerText = r.record_created_utc ? new Date(r.record_created_utc).toLocaleString() : '—';
      document.getElementById('sum-user').innerText = r.user_name || r.user_email || '—';

      // If we don't have an explicit country/city column, look it up from the
      // coordinates. This calls this specific record only (not the whole list),
      // to stay within OpenStreetMap Nominatim's free usage policy.
      if ((!explicitCountry || !explicitCity) && r.gps_latitude && r.gps_longitude) {
        const recordIdAtRequestTime = r.record_id;
        reverseGeocode(r.gps_latitude, r.gps_longitude).then(loc => {
          // Guard against the user having selected a different record while this was loading
          if (currentIndex === -1 || currentRecords[currentIndex].record_id !== recordIdAtRequestTime) return;
          if (!explicitCountry) document.getElementById('sum-country').innerText = loc.country || 'Unknown';
          if (!explicitCity) document.getElementById('sum-city').innerText = loc.city || 'Unknown';
        });
      }

      const attrsEl = document.getElementById('attributes-list');

      const hideKeys = [
        'record_id', 'media_file_name', 'media_annual_link', 'storage_path',
        'created_at', 'updated_at', 'id', 'user_agent', 'session_id', 'thumbnail_url'
      ];

      function buildAttributes(showTech) {
        const recRows = [];
        const detRows = [];

        function addIfNotNull(key, val, targetArr) {
          if (val === null || val === undefined || String(val).trim() === '') return;
          if (!showTech && hideKeys.includes(key)) return;
          targetArr.push(`<div class="col-12 border-bottom pb-1"><strong>${key}:</strong> ${val}</div>`);
        }

        Object.entries(r).forEach(([k, v]) => {
          if (k === 'media_file_name' || k === 'media_annual_link') return;
          addIfNotNull(k, v, recRows);
        });

        if (details && typeof details === 'object') {
          Object.entries(details).forEach(([k, v]) => {
            if (k === 'record_id') return;
            addIfNotNull(k, v, detRows);
          });
        }

        let html = '';
        if (recRows.length) html += '<div class="col-12"><h6 class="mb-2">Records</h6></div>' + recRows.join('');
        if (detRows.length) html += '<div class="col-12"><h6 class="mb-2">Record_details</h6></div>' + detRows.join('');
        if (!html) html = '<div class="col-12 text-muted">No attributes available.</div>';

        attrsEl.innerHTML = html;
      }

      const showTechCheckbox = document.getElementById('show-tech');
      if (showTechCheckbox) {
        showTechCheckbox.checked = false;
        showTechCheckbox.onchange = () => buildAttributes(showTechCheckbox.checked);
      }
      buildAttributes(false);

      // Fields selector
      const fieldsEl = document.getElementById('fields-selector');
      if (fieldsEl) {
        const keys = new Set(Object.keys(r));
        if (details && typeof details === 'object') Object.keys(details).forEach(k => keys.add(k));
        const keysArr = Array.from(keys).sort();

        const fieldsConfigText = document.getElementById('fields-config') ? document.getElementById('fields-config').value : '';
        const defaultSelected = new Set(fieldsConfigText.split(/\r?\n/).map(s => s.trim()).filter(Boolean));
        fieldsEl.innerHTML = keysArr.map(k => {
          const present = (r[k] !== undefined && r[k] !== null && String(r[k]).trim() !== '') || (details && details[k] !== undefined && details[k] !== null && String(details[k]).trim() !== '');
          const checked = (defaultSelected.size ? defaultSelected.has(k) : present) ? 'checked' : '';
          return `\n            <div class="col-12 d-flex align-items-center">\n              <input class="form-check-input me-2 field-choice" type="checkbox" id="field_${k}" data-key="${k}" ${checked}>\n              <label class="mb-0 small text-truncate" for="field_${k}">${k}</label>\n            </div>`;
        }).join('');

        const checkboxes = fieldsEl.querySelectorAll('.field-choice');
        checkboxes.forEach(cb => cb.addEventListener('change', () => {
          const selected = new Set(Array.from(fieldsEl.querySelectorAll('.field-choice')).filter(x => x.checked).map(x => x.getAttribute('data-key')));
          const showTech = document.getElementById('show-tech') ? document.getElementById('show-tech').checked : false;
          if (selected.size === 0) {
            buildAttributes(showTech);
          } else {
            const customRows = [];
            selected.forEach(key => {
              const val = (r[key] !== undefined && r[key] !== null && String(r[key]).trim() !== '') ? r[key] : (details && details[key] !== undefined ? details[key] : '');
              if (val === '' || val === null || val === undefined) return;
              customRows.push(`<div class="col-12 border-bottom pb-1"><strong>${key}:</strong> ${val}</div>`);
            });
            attrsEl.innerHTML = customRows.length ? customRows.join('') : '<div class="col-12 text-muted">No attributes selected.</div>';
          }
        }));
      }
    }

    async function changeStatus(newState) {
      if (currentIndex === -1) return;
      const id = currentRecords[currentIndex].record_id;
      const stateValue = Number(newState);
      try {
        const { data, error } = await _supabase.schema('btv2').from('records').update({ state: stateValue }).eq('record_id', id).select();
        if (error) {
          console.error('Failed to update record state', error);
          alert('Update error: ' + (error.message || JSON.stringify(error)));
          return;
        }
        currentRecords.splice(currentIndex, 1);
        currentIndex = -1;
        document.getElementById('inspector').style.display = 'none';
        document.getElementById('empty-msg').classList.remove('d-none');
        renderList();
      } catch (ex) {
        console.error('Exception updating state', ex);
        alert('Exception updating state: ' + ex.message);
      }
    }

    // --- Helper: which type counts as "true" right now (the moderator's
    // correction if there is one, otherwise whatever the user originally typed) ---
    function effectiveType(r) {
      return (r.record_maintype_corrected && String(r.record_maintype_corrected).trim() !== '')
        ? r.record_maintype_corrected
        : r.record_maintype;
    }

    // --- Export the current list (per the active filters) as an Excel file with
    // two tabs: "Original" (exactly what the user submitted) and "Final" (with any
    // moderator corrections applied). Rows that were never corrected are identical
    // on both tabs. ---
    function buildSheetFromRows(rows) {
      const headerSet = new Set();
      rows.forEach(row => Object.keys(row).forEach(k => headerSet.add(k)));
      const header = Array.from(headerSet);
      const aoa = [header, ...rows.map(row => header.map(h => (row[h] === undefined ? '' : row[h])))];
      return XLSX.utils.aoa_to_sheet(aoa);
    }

    async function exportCurrentListToExcel() {
      const exportBtn = document.getElementById('btn-export-csv');
      const originalText = exportBtn.innerText;
      exportBtn.disabled = true;
      exportBtn.innerText = 'Preparing export...';

      try {
        if (!currentRecords.length) {
          alert('No records loaded with the current filters.');
          return;
        }

        const ids = currentRecords.map(r => r.record_id);
        // Traer todos los record_details en un solo query (relación 1:1)
        const { data: detailsList, error: detErr } = await _supabase.schema('btv2')
          .from('record_details').select('*').in('record_id', ids);
        if (detErr) console.warn('No se pudieron traer record_details para el export', detErr);

        const detailsByRecordId = {};
        (detailsList || []).forEach(d => { detailsByRecordId[d.record_id] = d; });

        const originalRows = [];
        const finalRows = [];

        currentRecords.forEach(r => {
          const det = detailsByRecordId[r.record_id] || {};
          const baseRow = { ...r };
          Object.entries(det).forEach(([k, v]) => {
            if (k === 'record_id') return;
            baseRow['det_' + k] = v;
          });
          delete baseRow.record_maintype_corrected; // shown separately, not as a plain column

          // "Original" tab: record_maintype exactly as the user submitted it.
          originalRows.push({ ...baseRow, record_maintype: r.record_maintype });

          // "Final" tab: the moderator's correction wins when there is one.
          finalRows.push({
            ...baseRow,
            record_maintype: effectiveType(r),
            was_corrected: !!(r.record_maintype_corrected && r.record_maintype_corrected !== r.record_maintype)
          });
        });

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, buildSheetFromRows(originalRows), 'Original');
        XLSX.utils.book_append_sheet(wb, buildSheetFromRows(finalRows), 'Final (reviewed)');

        const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
        XLSX.writeFile(wb, `barrier_tracker_export_${stamp}.xlsx`);
      } catch (ex) {
        console.error('Error exporting Excel', ex);
        alert('Error exporting Excel: ' + ex.message);
      } finally {
        exportBtn.disabled = false;
        exportBtn.innerText = originalText;
      }
    }


    // Cerrar overlay
    document.addEventListener('DOMContentLoaded', () => {
      const overlayClose = document.getElementById('overlay-close');
      if (overlayClose) overlayClose.onclick = () => { document.getElementById('img-overlay').style.display = 'none'; };
    });
  </script>
</body>
